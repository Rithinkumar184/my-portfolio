    <style>
        :root {
            --bg-deep: #020617;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --card-glass: rgba(30, 41, 59, 0.6);
            --border-glow: rgba(139, 92, 246, 0.4);
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-pink: #d946ef;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Fast Cinematic Intro --- */
        #cinematic-intro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            opacity: 1; transition: opacity 0.8s ease;
        }
        #cinematic-intro.fade-out { opacity: 0; pointer-events: none; }
        .intro-line { width: 0; height: 3px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); margin-bottom: 30px; box-shadow: 0 0 20px var(--accent-cyan); animation: drawLine 1s 0.2s forwards cubic-bezier(0.22, 1, 0.36, 1); }
        .intro-text { color: var(--text-main); font-family: 'Cinzel', serif; font-size: 1.6rem; letter-spacing: 8px; text-transform: uppercase; opacity: 0; transform: translateY(20px); animation: revealText 1s 0.6s forwards ease-out; }
        @keyframes drawLine { to { width: 250px; } }
        @keyframes revealText { to { opacity: 1; transform: translateY(0); } }

        /* --- Main App --- */
        #app {
            position: relative; width: 100%; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
        }

        /* --- Chapter Intro Overlay --- */
        #chapter-intro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50;
            display: flex; justify-content: center; align-items: center;
            transform: translateX(-100%); 
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #chapter-intro.active { transform: translateX(0); }
        #chapter-intro.exit { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1); }
        
        #chapter-title {
            font-family: 'Cinzel', serif; font-size: 5rem; letter-spacing: 10px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0; transform: scale(0.8);
            animation: chapterReveal 0.6s 0.2s forwards ease-out;
        }
        @keyframes chapterReveal { to { opacity: 1; transform: scale(1); } }

        /* --- Content Section --- */
        #section-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 60px 10%; overflow-y: auto;
            display: flex; flex-direction: column;
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #section-container.active { opacity: 1; transform: translateY(0); }
        #section-container::-webkit-scrollbar { width: 6px; }
        #section-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        #section-container::-webkit-scrollbar-thumb { background: var(--accent-purple); border-radius: 3px; }

        .content-wrapper {
            width: 100%;
            margin: auto 0;
            padding: 40px 0;
        }

        h2 {

            display: inline-block; letter-spacing: 2px; position: relative; padding-bottom: 10px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        h2::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); box-shadow: 0 0 10px var(--accent-cyan); }

        .skill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .skill-box { 
            background: var(--card-glass); padding: 20px; border-radius: 12px; 
            border: 1px solid rgba(139, 92, 246, 0.2); transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);

        .skill-box h4 i { color: var(--accent-purple); margin-right: 8px; }

        .project-card-book { 
            background: var(--card-glass); padding: 30px; border-radius: 15px; margin-bottom: 30px; 
            border: 1px solid rgba(139, 92, 246, 0.2); transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);

        .btn-book {

        .compact-section .about-img { width: 120px; height: 120px; margin-left: 20px; margin-bottom: 10px; }
        .compact-section .skill-box { padding: 15px; }

        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2);
            cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.3);
        }
        .dot.active { background: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan); transform: scale(1.3); border-color: var(--accent-cyan); }

        /* --- Fast Reveal Animations --- */
        .reveal-item {
            opacity: 0; transform: translateY(20px);
            animation: fastSlideUp 0.5s forwards;
        }
        @keyframes fastSlideUp { to { opacity: 1; transform: translateY(0); } }

        .project-stagger {
            opacity: 0; transform: translateY(60px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);

        @media (max-width: 768px) {
            #chapter-title { font-size: 2.5rem; letter-spacing: 3px; }
            #section-container { padding: 40px 5%; }
            h2 { font-size: 1.8rem; }
            .grid-2 { grid-template-columns: 1fr; gap: 20px; }
            .about-img { float: none; display: block; margin: 0 auto 20px auto; }
        }
    </style>
</head>

                            <div class="skill-box reveal-item" style="animation-delay: 0.3s; text-align: center; padding: 30px;">
                                <i class="fas fa-motorcycle" style="font-size: 2rem; color: var(--accent-purple); margin-bottom: 15px; display:block;"></i>
                                <h4>Adventure</h4>
                                <p>Bike riding to explore new places and enjoy the thrill of the open road.</p>
                            </div>
                            <div class="skill-box reveal-item" style="animation-delay: 0.4s; text-align: center; padding: 30px;">
                                <i class="fas fa-book-reader" style="font-size: 2rem; color: var(--accent-pink); margin-bottom: 15px; display:block;"></i>
                                <h4>Continuous Learning</h4>
                                <p>Continuously learning new technologies and expanding my knowledge in data analysis and software development.</p>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                title: "CONTACT",
                content: `
                    <div class="content-wrapper compact-section">
                        <h2 class="reveal-item" style="margin-bottom: 25px;">Get In Touch</h2>
                        <div class="contact-layout reveal-item" style="animation-delay: 0.1s;">
                            <div class="contact-left">
                                <div class="contact-item-compact">
                                    <i class="fas fa-phone"></i>
                                    <div><h3>Phone</h3><p>8125768890</p></div>
                                </div>
                                <div class="contact-item-compact">
                                    <i class="fas fa-envelope"></i>
                                    <div><h3>Email</h3><p style="font-size: 0.8rem;">upputururithin111@gmail.com</p></div>
                                </div>
                                <div class="contact-item-compact">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <div><h3>Location</h3><p style="font-size: 0.8rem;">Mahmmadapuram (v), Nellore (dt), AP, India</p></div>
                                </div>
                            </div>
                            
                            <div class="contact-right">
                                <form id="contactForm" onsubmit="handleSubmit(event)">
                                    <div class="form-group"><label for="name">Your Name</label><input type="text" id="name" required></div>
                                    <div class="form-group"><label for="email">Your Email</label><input type="email" id="email" required></div>
                                    <div class="form-group"><label for="message">Message</label><textarea id="message" required></textarea></div>
                                    <button type="submit" class="btn-book">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;
        const chapterIntro = document.getElementById('chapter-intro');
        const chapterTitle = document.getElementById('chapter-title');
        const sectionContainer = document.getElementById('section-container');
        const navDots = document.getElementById('nav-dots');

        sections.forEach((sec, i) => {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => navigateTo(i);
            navDots.appendChild(dot);
        });

        function updateDots() {
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === currentIndex);
            });
        }

        async function navigateTo(index) {
            if (isAnimating || index === currentIndex || index < 0 || index >= sections.length) return;
            isAnimating = true;

            sectionContainer.classList.remove('active');
            await new Promise(r => setTimeout(r, 300));

            chapterTitle.innerText = sections[index].title;
            chapterTitle.style.animation = 'none';
            chapterTitle.offsetHeight; 
            chapterTitle.style.animation = 'chapterReveal 0.6s 0.2s forwards ease-out';
            
            chapterIntro.classList.remove('exit');
            chapterIntro.classList.add('active');
            await new Promise(r => setTimeout(r, 800)); 

            sectionContainer.innerHTML = sections[index].content;
            sectionContainer.scrollTop = 0; // Reset scroll for new page
            currentIndex = index;
            updateDots();

            chapterIntro.classList.add('exit');
            chapterIntro.classList.remove('active');
            
            setTimeout(() => { sectionContainer.classList.add('active'); }, 200);
            await new Promise(r => setTimeout(r, 400)); 
            
            if (currentIndex === 3) triggerProjectAnimation();

            isAnimating = false;
        }

        function triggerProjectAnimation() {
            const projects = document.querySelectorAll('.project-stagger');
            const container = document.getElementById('section-container');
            
            // Ensure we start at the top
            container.scrollTop = 0; 

            projects.forEach((proj, index) => {
                setTimeout(() => { 
                    proj.classList.add('visible');
                    // Smooth scroll the container to the newly appeared project
                    setTimeout(() => {
                        proj.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }, (index + 1) * 2000); // 2s for first, 4s for second, 6s for third, 8s for fourth
            });
        }

        function handleSubmit(e) {
            e.preventDefault();
            alert('Thank you! Your message has been sent successfully.');
            e.target.reset();
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('cinematic-intro').classList.add('fade-out');
                setTimeout(() => {
                    sectionContainer.innerHTML = sections[0].content;
                    sectionContainer.classList.add('active');
                }, 500);
            }, 2000); 
        };

        let touchStartY = 0;
        window.addEventListener('wheel', (e) => {
            if (e.deltaY > 30) navigateTo(currentIndex + 1);
            else if (e.deltaY < -30) navigateTo(currentIndex - 1);
        }, { passive: true });

        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (diff > 50) navigateTo(currentIndex + 1);
            else if (diff < -50) navigateTo(currentIndex - 1);
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') navigateTo(currentIndex + 1);
            else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') navigateTo(currentIndex - 1);
        });
    </script>
</body>
</html>
